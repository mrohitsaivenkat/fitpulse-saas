{% extends "base.html" %}

{% block title %}403 - Access Denied | FitPulse{% endblock %}

{% block content %}
<section class="error-page">
    <div class="container text-center">
        <span class="error-code">403</span>
        <h1 class="error-title">Access Prohibited</h1>
        <p class="error-desc">Multi-tenant security policy restricts access to this resource. You do not have permission to view this workspace.</p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">Return to Safety</a>
        </div>
    </div>
</section>
{% endblock %}
